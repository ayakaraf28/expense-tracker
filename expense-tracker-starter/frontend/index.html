<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
 
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <div class="container my-5 d-none">

      <div id="spinner" class="text-center d-none">
        <div class="spinner-border text-primary" role="status">
          <span>Loading...</span>
        </div>
      </div>

      <div id="user_container" class="row g-3"></div>
    </div>
<nav class="navbar navbar-dark bg-dark ">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <span class="navbar-brand mb-0 h1 text-light ">Expense Tracker</span>
  
    <button id="themeToggleBtn" class="btn btn-outline-secondary mb-3">
  🌙 Dark Mode
</button>
  </div>
</nav>
      <div id="statusMessage" style="display: none; padding: 12px 16px; border-radius: 6px; margin-bottom: 15px; font-weight: bold; transition: all 0.3s ease;"></div>

  <div class="containerSummaryCard">

    <div class="card">
      <div class="card-body text-center">
        <h6 class="card-title ">Total</h6>
        <h4 class="text-bold" id="totalAmount">0.00$</h4>
      </div>
  </div>

    <div class="card ">
      <div class="card-body text-center">
        <h6 class="card-title">Number of expenses</h6>
        <h4 class="text-bold" id="totalCount">0</h4>
      </div>
    </div>
 

    <div class="card">
      <div class="card-body text-center">
        <h6 class="card-title">Highest Expense</h6>
        <h4 class="text-bold" id="highestExpense">0.00$</h4>
        <h5 id="expenseName">0</h5>
        
      </div>
    </div>
  
  </div>
</div>
<!-- form -->
<div class="container my-4 ">
<form class="border border-1 rounded shadow-4" id="expenseForm">
  <div>
  <div class="container p-2">
    <h5 class="mb-3 p-2">Add Expense</h5>
    <div class="row">
  <div class="col-md-3">
    <div>
    <label for="titleInput" class="form-label">Title</label>
    <input type="text" class="form-control" id="titleInput" placeholder="Lunch" required>
    </div>
  </div>
  <div class="col-md-3">
    <div>
    <label for="amountInput" class="form-label">Amount</label>
    <input type="number" class="form-control" id="amountInput" placeholder="4.5" min="0" required>
    <small id="amountError" class="text-danger d-none">The number must be more than 0</small>
    </div>
  </div>
  <div class="col-md-3">
    <label for="categoryInput" class="form-label">Category</label>
    <select class="form-select form-select-sm" id="categoryInput" required>
    <option value="" disabled selected>Choose..</option>
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Bills">Bills</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Others">Others</option>
  </select>  </div>
  <div class="col-md-3">
    <label for="dateInput" class="form-label">Date</label>
    <input type="date" class="form-control" id="dateInput">
  </div>
   
    </div>
      <button type="submit" class="btn btn-primary m-3">Add Expense</button>
  </div>
</div>
</form>
</div>
<!-- عملية الفلترة -->
<div class="container my-3">
  <div class="row m-2">
    <div class="col-md-10"><h6 >Expenses</h6></div>
    <div class="col-md-2 d-flex align-items-center gap-2">
      <label for="filterCategory" class="form-label">Category</label>
   <select class="form-select form-select-sm " id="filterCategory">
    <option value="All" selected>All</option>
    <option value="Food">Food</option>
    <option value="Transport">Transport</option>
    <option value="Bills">Bills</option>
    <option value="Entertainment">Entertainment</option>
    <option value="Others">Others</option>
  </select> </div>
  </div>

  
     <!-- Expense table -->
  <table class="table border border-1">
  <thead>
    <tr>
      <th>Title</th>
      <th>Amount</th>
      <th>Category</th>
      <th>Date</th>
      <th>Action</th>
    </tr>
  </thead>
  <tbody id="expensesTableBody">
    
    
  </tbody>
</table>
<div class="d-flex justify-content-end mt-2 mb-4">
    <button id="exportCsvBtn" class="btn btn-success btn-sm m-2">
      📥 Export to CSV
    </button>
    <button id="deleteAllBtn" class="btn btn-outline-danger btn-sm m-2">
    🗑️ Delete All
  </button>
  </div>
</div>
<!-- Chart canva-->
<div style="width: 350px; margin: auto;">
  <canvas id="expensesChart"></canvas>
  
</div>



<!-- Edit Expense Modal -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Edit Expense</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editForm">
          <div class="mb-3">
            <label for="editTitleInput" class="form-label">Title</label>
            <input type="text" class="form-control" id="editTitleInput" required>
          </div>
          <div class="mb-3">
            <label for="editAmountInput" class="form-label">Amount</label>
            <input type="number" step="0.01" min="0.01" class="form-control" id="editAmountInput" required>
            <small id="editAmountError" class="text-danger d-none">The number must be more than 0</small>
          </div>
          <div class="mb-3">
            <label for="editCategoryInput" class="form-label">Category</label>
            <select class="form-select" id="editCategoryInput" required>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Bills">Bills</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Others">Others</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="editDateInput" class="form-label">Date</label>
            <input type="date" class="form-control" id="editDateInput">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
